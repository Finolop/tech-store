<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2ec4ff"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="neonWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="300" cy="540" rx="140" ry="24" fill="#000000" opacity="0.45" filter="url(#glow)"/>

  <!-- Phone Titanium Frame -->
  <rect x="180" y="60" width="240" height="460" rx="42" fill="url(#rimGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="184" y="64" width="232" height="452" rx="38" fill="url(#bodyGrad)"/>

  <!-- Screen Bezel & Display -->
  <rect x="192" y="74" width="216" height="432" rx="30" fill="url(#screenGrad)"/>

  <!-- Abstract Screen Wallpaper -->
  <circle cx="340" cy="220" r="80" fill="url(#neonWave)" filter="url(#glow)"/>
  <path d="M 192 360 Q 250 280 300 340 T 408 280 L 408 506 L 192 506 Z" fill="url(#neonWave)" opacity="0.5"/>
  <circle cx="260" cy="380" r="50" fill="#38bdf8" opacity="0.4" filter="url(#glow)"/>

  <!-- Minimal Clock & Status Bar -->
  <text x="300" y="160" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.95">12:00</text>
  <text x="300" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">ARCSHOP 5G</text>

  <!-- Dynamic Island / Punch Hole Camera -->
  <rect x="265" y="86" width="70" height="18" rx="9" fill="#000000"/>
  <circle cx="316" cy="95" r="4" fill="#1e293b"/>
  <circle cx="316" cy="95" r="1.5" fill="#38bdf8"/>

  <!-- Glass Glare Reflection -->
  <path d="M 192 74 L 320 74 L 210 506 L 192 506 Z" fill="#ffffff" opacity="0.04"/>
</svg>