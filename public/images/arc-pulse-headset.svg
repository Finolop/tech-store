<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rgbRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="earcupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282d3f"/>
      <stop offset="50%" stop-color="#151824"/>
      <stop offset="100%" stop-color="#0c0e17"/>
    </linearGradient>
    <filter id="rgbGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="300" cy="510" rx="180" ry="24" fill="#000000" opacity="0.45" filter="url(#rgbGlow)"/>

  <!-- Headband Arch (outer steel band) -->
  <path d="M 170 300 C 170 120 430 120 430 300" fill="none" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
  <!-- Padded Inner Cushion -->
  <path d="M 210 240 C 210 135 390 135 390 240" fill="none" stroke="url(#headbandGrad)" stroke-width="26" stroke-linecap="round"/>
  <!-- Cushion stitched segment marks -->
  <line x1="270" y1="140" x2="270" y2="166" stroke="#0f172a" stroke-width="2"/>
  <line x1="300" y1="137" x2="300" y2="163" stroke="#0f172a" stroke-width="2"/>
  <line x1="330" y1="140" x2="330" y2="166" stroke="#0f172a" stroke-width="2"/>

  <!-- Left Hanger Fork -->
  <path d="M 170 290 L 170 350" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <!-- Right Hanger Fork -->
  <path d="M 430 290 L 430 350" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>

  <!-- Left Ear Cushion & Cup -->
  <rect x="135" y="300" width="70" height="150" rx="35" fill="url(#earcupGrad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="150" y="320" width="40" height="110" rx="20" fill="#090d16"/>
  <!-- Left RGB Glow Ring -->
  <rect x="156" y="332" width="28" height="86" rx="14" fill="none" stroke="url(#rgbRing)" stroke-width="4" filter="url(#rgbGlow)"/>

  <!-- Right Ear Cushion & Cup -->
  <rect x="395" y="300" width="70" height="150" rx="35" fill="url(#earcupGrad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="410" y="320" width="40" height="110" rx="20" fill="#090d16"/>
  <!-- Right RGB Glow Ring -->
  <rect x="416" y="332" width="28" height="86" rx="14" fill="none" stroke="url(#rgbRing)" stroke-width="4" filter="url(#rgbGlow)"/>

  <!-- Detachable Mic Boom -->
  <path d="M 160 410 Q 150 490 240 480" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <!-- Mic Capsule with LED tip -->
  <rect x="240" y="472" width="26" height="16" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="262" cy="480" r="3" fill="#22d3ee" filter="url(#rgbGlow)"/>

  <!-- Audio Wave Accent Details -->
  <circle cx="300" cy="360" r="28" fill="#6366f1" opacity="0.1" filter="url(#rgbGlow)"/>
  <text x="300" y="365" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">PULSE ANC</text>
  <text x="300" y="382" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">HI-RES 40H</text>
</svg>