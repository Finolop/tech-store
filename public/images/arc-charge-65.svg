<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="chargerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242838"/>
      <stop offset="60%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="goldPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ganGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="chargerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="300" cy="510" rx="150" ry="22" fill="#000000" opacity="0.45" filter="url(#chargerGlow)"/>

  <!-- Main GaN Brick Body (Front 3/4 Face) -->
  <rect x="200" y="140" width="200" height="320" rx="36" fill="url(#chargerBody)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Top Chamfer Highlight -->
  <path d="M 230 142 L 370 142" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Power Status LED Indicator -->
  <circle cx="300" cy="180" r="5" fill="#22d3ee" filter="url(#chargerGlow)"/>
  <circle cx="300" cy="180" r="2" fill="#ffffff"/>

  <!-- USB Type-C Port 1 (PD 65W Max) -->
  <rect x="245" y="215" width="110" height="38" rx="19" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  <rect x="270" y="230" width="60" height="8" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="270" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">TYPE-C 1 (65W)</text>

  <!-- USB Type-C Port 2 (PD 30W) -->
  <rect x="245" y="295" width="110" height="38" rx="19" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  <rect x="270" y="310" width="60" height="8" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="350" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">TYPE-C 2 (30W)</text>

  <!-- USB Type-A Port 3 (Fast QC 22.5W) -->
  <rect x="245" y="375" width="110" height="42" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  <rect x="255" y="387" width="90" height="18" rx="4" fill="#1e293b"/>
  <rect x="258" y="394" width="84" height="6" fill="url(#goldPort)"/>
  <text x="300" y="435" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">USB-A QC 3.0</text>

  <!-- Branding and GaN tech label -->
  <text x="300" y="475" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ARC CHARGE</text>
  <text x="300" y="492" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">GaN III FAST TECH</text>
</svg>