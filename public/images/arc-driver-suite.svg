<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="softBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="softNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#000000" opacity="0.45" filter="url(#softGlow)"/>

  <!-- Isometric / Angled Software Box -->
  <!-- Box Front Face -->
  <path d="M 210 170 L 390 130 L 390 420 L 210 460 Z" fill="url(#softBox)" stroke="#3b82f6" stroke-width="2"/>

  <!-- Box Spine / Side Face -->
  <path d="M 140 145 L 210 170 L 210 460 L 140 435 Z" fill="#14182b" stroke="#1e293b" stroke-width="2"/>

  <!-- Box Top Face -->
  <path d="M 140 145 L 320 105 L 390 130 L 210 170 Z" fill="#242944" stroke="#334155" stroke-width="2"/>

  <!-- Glowing Emblem / Circuit Shield on Front -->
  <circle cx="300" cy="270" r="45" fill="none" stroke="url(#softNeon)" stroke-width="3" filter="url(#softGlow)"/>
  <circle cx="300" cy="270" r="32" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Tech Sync Icon inside Emblem -->
  <path d="M 288 260 L 300 248 L 312 260" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="300" y1="250" x2="300" y2="290" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Title on Front Cover -->
  <text x="300" y="360" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ARC DRIVER</text>
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">SUITE PRO 4.2</text>
  <text x="300" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">WINDOWS &amp; LINUX</text>

  <!-- Spine Title -->
  <text x="175" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 175 300)" letter-spacing="2">ARC SOFTWARE</text>
</svg>