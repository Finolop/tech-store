<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bannerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="bigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="400" rx="24" fill="url(#bgBanner)"/>

  <!-- Cyber Neon Glow Orbs -->
  <circle cx="950" cy="180" r="160" fill="url(#bannerGlow)" opacity="0.3" filter="url(#bigGlow)"/>
  <circle cx="200" cy="350" r="120" fill="#3b82f6" opacity="0.15" filter="url(#bigGlow)"/>

  <!-- Decorative Tech Grid & Wave Lines -->
  <path d="M 0 320 Q 300 240 600 300 T 1200 260" fill="none" stroke="url(#bannerGlow)" stroke-width="2" opacity="0.4"/>
  <path d="M 0 280 Q 400 360 800 280 T 1200 340" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Left Text Content -->
  <rect x="80" y="70" width="130" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="145" y="91" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SPRING SALE • 25%</text>

  <text x="80" y="160" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#ffffff">Весенняя распродажа</text>
  <text x="80" y="200" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1">Скидки на ультрабуки, смартфоны и аудио</text>
  <text x="80" y="240" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Флагманские чипы, экраны 120 Гц и быстрая зарядка GaN</text>

  <!-- CTA Button Indicator -->
  <rect x="80" y="275" width="200" height="48" rx="24" fill="url(#bannerGlow)"/>
  <text x="180" y="305" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">В каталог техники →</text>

  <!-- Right Visual: Stylized Tech Collage (Laptop + Phone + Headphones) -->
  <!-- Laptop in background -->
  <rect x="820" y="90" width="260" height="170" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="830" y="100" width="240" height="150" rx="8" fill="#090d16"/>
  <text x="950" y="180" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">ARCSHOP</text>
  <path d="M 780 260 L 820 260 L 1080 260 L 1120 260 L 1140 280 L 760 280 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Phone floating in front -->
  <rect x="740" y="130" width="100" height="190" rx="20" fill="#0f172a" stroke="#6366f1" stroke-width="2.5" filter="url(#bigGlow)"/>
  <rect x="745" y="136" width="90" height="178" rx="16" fill="url(#bgBanner)"/>
  <circle cx="790" cy="225" r="30" fill="url(#bannerGlow)" opacity="0.6"/>

  <!-- Glowing Headset Silhouette -->
  <circle cx="1060" cy="220" r="45" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.7"/>
  <rect x="1010" y="200" width="20" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="1090" y="200" width="20" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
</svg>