<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="novaFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="novaScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b1e"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="novaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="novaBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="300" cy="540" rx="130" ry="22" fill="#000000" opacity="0.4" filter="url(#novaBlur)"/>

  <!-- Phone Bezel / Frame -->
  <rect x="185" y="65" width="230" height="450" rx="40" fill="url(#novaFrame)"/>
  <rect x="189" y="69" width="222" height="442" rx="36" fill="#09090b"/>

  <!-- Display -->
  <rect x="195" y="77" width="210" height="426" rx="28" fill="url(#novaScreen)"/>

  <!-- Futuristic Glowing Orbs -->
  <circle cx="270" cy="240" r="75" fill="url(#novaGlow)" filter="url(#novaBlur)"/>
  <circle cx="340" cy="350" r="60" fill="#ec4899" opacity="0.6" filter="url(#novaBlur)"/>
  <path d="M 195 380 Q 260 300 320 370 T 405 320 L 405 503 L 195 503 Z" fill="url(#novaGlow)" opacity="0.45"/>

  <!-- Clock & Widget -->
  <text x="300" y="165" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">09:41</text>
  <text x="300" y="188" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#fda4af" text-anchor="middle">NOVA S5 • FAST 80W</text>

  <!-- Camera Cutout -->
  <circle cx="300" cy="98" r="6" fill="#000000"/>
  <circle cx="300" cy="98" r="2.5" fill="#1e1b4b"/>
  <circle cx="301" cy="97" r="1" fill="#38bdf8"/>

  <!-- Glass Highlight -->
  <path d="M 195 77 L 310 77 L 220 503 L 195 503 Z" fill="#ffffff" opacity="0.05"/>
</svg>