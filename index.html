<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARCSHOP — Интернет-магазин электронной техники</title>
    <meta name="description" content="Интернет-магазин электроники и техники ARCSHOP с каталогом девайсов, умным сравнением характеристик, проверенными отзывами и корзиной." />
    <meta property="og:title" content="ARCSHOP — Интернет-магазин электронной техники" />
    <meta property="og:description" content="Интернет-магазин электроники и техники ARCSHOP с каталогом девайсов, умным сравнением характеристик, проверенными отзывами и корзиной." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- SPA redirect restore for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('arcshop:theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
